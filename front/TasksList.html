<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Tâches</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Liste des Tâches</h1>
            <nav>
                <a href="/" class="btn btn-secondary">🏠 Accueil</a>
                <a href="/createTask" class="btn btn-success">➕ Nouvelle tâche</a>
            </nav>
        </header>

        <div class="filters-section">
            <h3>🔍 Filtres et Tri</h3>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="filterStatut">Statut :</label>
                    <select id="filterStatut">
                        <option value="">Tous</option>
                        <option value="En attente">En attente</option>
                        <option value="En cours">En cours</option>
                        <option value="Terminée">Terminée</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterPriorite">Priorité :</label>
                    <select id="filterPriorite">
                        <option value="">Toutes</option>
                        <option value="Haute">Haute</option>
                        <option value="Moyenne">Moyenne</option>
                        <option value="Basse">Basse</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="filterCategorie">Catégorie :</label>
                    <select id="filterCategorie">
                        <option value="">Toutes</option>
                        <option value="Travail">Travail</option>
                        <option value="Personnel">Personnel</option>
                        <option value="Urgent">Urgent</option>
                        <option value="Projet">Projet</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="sortBy">Trier par :</label>
                    <select id="sortBy">
                        <option value="dateCreation">Date de création</option>
                        <option value="echeance">Échéance</option>
                        <option value="priorite">Priorité</option>
                        <option value="titre">Titre</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="searchText">Recherche :</label>
                    <input type="text" id="searchText" placeholder="Rechercher...">
                </div>

                <div class="filter-group">
                    <button id="resetFilters" class="btn btn-secondary">🔄 Réinitialiser</button>
                </div>
            </div>
        </div>

        <main>
            <div id="tasksContainer" class="tasks-grid">
                <div class="loading">Chargement des tâches...</div>
            </div>

            <div id="noTasks" class="no-tasks" style="display: none;">
                <p>😔 Aucune tâche trouvée</p>
                <a href="/createTask" class="btn btn-primary">Créer votre première tâche</a>
            </div>
        </main>
    </div>

    <script src="TasksList.js"></script>
</body>
</html>
